<svg xmlns="http://www.w3.org/2000/svg" viewBox="185 180 635 635" width="100%" height="100%" style="background-color: #030208;">
  <defs>
    <!-- 霓虹光源的高斯模糊滤镜 -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="90" />
    </filter>

    <!-- 优化的 3D 平滑波浪滤镜：使用单层级平滑噪波，防止粒子撕裂变形 -->
    <filter id="wave-distort" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0035" numOctaves="1" seed="54" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="150" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <!-- 完美的粒子点阵遮罩 -->
    <mask id="dot-mask">
      <rect x="0" y="0" width="1000" height="1000" fill="black" />
      
      <!-- shape-rendering 确保图形边缘抗锯齿，完美圆润 -->
      <g transform="translate(500, 500)" filter="url(#wave-distort)" fill="none" stroke="white" stroke-linecap="round" stroke-dasharray="0 20" shape-rendering="geometricPrecision">
        <!-- 
          数学完美半径计算： r = N * 20 / (2 * PI) 
          保证每一环的点阵间距绝对均匀，首尾完美闭合，0缝隙、0重叠
        -->
        <circle r="63.66" stroke-width="1.5" />
        <circle r="76.39" stroke-width="2" />
        <circle r="89.13" stroke-width="3" />
        <circle r="101.86" stroke-width="4" />
        <circle r="114.59" stroke-width="5.5" />
        <circle r="127.32" stroke-width="7" />
        <circle r="140.06" stroke-width="8.5" />
        <circle r="152.79" stroke-width="10" />
        <circle r="165.52" stroke-width="11" />
        <circle r="178.25" stroke-width="12" /> <!-- 峰顶最大粒子 -->
        <circle r="190.99" stroke-width="12" /> <!-- 峰顶最大粒子 -->
        <circle r="203.72" stroke-width="11" />
        <circle r="216.45" stroke-width="9.5" />
        <circle r="229.18" stroke-width="8" />
        <circle r="241.92" stroke-width="6.5" />
        <circle r="254.65" stroke-width="5" />
        <circle r="267.38" stroke-width="4" />
        <circle r="280.11" stroke-width="3" />
        <circle r="292.85" stroke-width="2" />
        <circle r="305.58" stroke-width="1.5" />
        <circle r="318.31" stroke-width="1.2" />
        <circle r="331.04" stroke-width="1" />
        <circle r="343.77" stroke-width="1" />
        <circle r="356.51" stroke-width="0.8" />
        <circle r="369.24" stroke-width="0.8" />
        <circle r="381.97" stroke-width="0.6" />
        <circle r="394.70" stroke-width="0.6" />
        <circle r="407.44" stroke-width="0.5" />
        <circle r="420.17" stroke-width="0.5" />
        <circle r="432.90" stroke-width="0.5" />
        <circle r="445.63" stroke-width="0.5" />
      </g>
    </mask>

    <!-- 文字轻微发光和阴影 -->
    <filter id="text-glow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- 应用了粒子遮罩的光谱渐变组合 -->
  <g mask="url(#dot-mask)">
    <rect width="1000" height="1000" fill="#000" />
    
    <!-- 通过重度模糊的色块重新构建原图的霓虹色彩分布 -->
    <g filter="url(#neon-glow)">
      <circle cx="150" cy="750" r="350" fill="#00e5ff" /> <!-- 左下亮青色 -->
      <circle cx="300" cy="250" r="350" fill="#3a00ff" /> <!-- 左上深蓝色 -->
      <circle cx="750" cy="200" r="400" fill="#ff004c" /> <!-- 右上粉红色 -->
      <circle cx="850" cy="650" r="350" fill="#ff5e00" /> <!-- 右下亮橙色 -->
      <circle cx="550" cy="850" r="300" fill="#b000ff" /> <!-- 底部紫罗兰 -->
      
      <!-- 中心黑洞，凸显中间的标志文字 -->
      <circle cx="500" cy="500" r="160" fill="#000" />
    </g>
  </g>

  <!-- 居中标志文字 -->
  <text x="500" y="516" 
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" 
        font-weight="900" 
        font-size="46" 
        fill="#ffffff" 
        text-anchor="middle" 
        letter-spacing="16" 
        filter="url(#text-glow)">
    MOODIST X
  </text>
</svg>
